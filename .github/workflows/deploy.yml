name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add base href to all HTML files
        run: |
          find . -name "*.html" -not -path "./.git/*" -exec \
            sed -i 's|<head>|<head><base href="/digital-map-binh-dinh/">|g' {} \;

      - name: Rewrite JS paths
        run: |
          find . -name "*.js" -not -path "./.git/*" -exec \
            sed -i \
              -e 's|location\.replace("/admin/dashboard")|location.replace("/digital-map-binh-dinh/admin/dashboard")|g' \
              -e 's|location\.replace("/admin")|location.replace("/digital-map-binh-dinh/admin")|g' \
            {} \;

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
