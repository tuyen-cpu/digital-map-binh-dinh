name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set base path
        # Tên repo trên GitHub — đổi nếu đổi tên repo
        run: echo "BASE=/digital-map-binh-dinh" >> $GITHUB_ENV

      - name: Rewrite root-absolute paths for GitHub Pages
        run: |
          python3 << 'PY'
          from pathlib import Path
          import os

          base = os.environ["BASE"].rstrip("/")

          # Không đụng /api/ — các gọi đó do JS xử lý nội bộ
          abs_roots = (
              "/assets/",
              "/data/",
              "/uploads/",
              "/admin",
              "/place.html",
              "/trang-chu.html",
              "/kham-pha-dia-diem.html",
              "/index.html",
          )
          rel_prefixes = (
              "assets/",
              "data/",
              "uploads/",
              "admin/",
              "place.html",
              "trang-chu.html",
              "kham-pha-dia-diem.html",
              "index.html",
          )
          skip_dirs = {".git", ".github", "node_modules"}
          exts = {".html", ".js", ".json", ".css"}

          def rewrite_absolute(text: str) -> str:
              for quote in ('"', "'", "`"):
                  for root in abs_roots:
                      text = text.replace(f"{quote}{root}", f"{quote}{base}{root}")
              text = text.replace('href="/"', f'href="{base}/"')
              text = text.replace("href='/'", f"href='{base}/'")
              text = text.replace('href="/#', f'href="{base}/#')
              text = text.replace("href='/#", f"href='{base}/#")
              for quote in ('"', "'", "`"):
                  text = text.replace(f"{quote}/?", f"{quote}{base}/?")
              return text

          def rewrite_relative_html(text: str) -> str:
              for attr in ("href", "src"):
                  for quote in ('"', "'"):
                      for prefix in rel_prefixes:
                          text = text.replace(
                              f"{attr}={quote}{prefix}",
                              f"{attr}={quote}{base}/{prefix}",
                          )
              return text

          changed = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in exts:
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              original = path.read_text(encoding="utf-8")
              updated = rewrite_absolute(original)
              if path.suffix.lower() == ".html":
                  updated = rewrite_relative_html(updated)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path).replace("\\", "/"))

          print(f"rewrote {len(changed)} files")
          for name in changed:
              print(f"  {name}")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
