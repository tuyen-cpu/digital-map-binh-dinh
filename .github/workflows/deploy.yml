name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject base href and fix JS paths
        run: |
          python3 - << 'PYEOF'
          import os, re

          BASE = "/digital-map-binh-dinh"

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in [".git", ".github"]]
              for fname in files:
                  path = os.path.join(root, fname)

                  if fname.endswith(".html"):
                      with open(path, "r", encoding="utf-8") as f:
                          content = f.read()
                      new_content = re.sub(
                          r"(<head\b[^>]*>)",
                          r'\1\n  <base href="' + BASE + '/">',
                          content, count=1, flags=re.IGNORECASE
                      )
                      if new_content != content:
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(new_content)
                          print("Patched HTML:", path)

                  elif fname.endswith(".js"):
                      with open(path, "r", encoding="utf-8") as f:
                          content = f.read()
                      new_content = content \
                          .replace('location.replace("/admin/dashboard")',
                                   'location.replace("' + BASE + '/admin/dashboard")') \
                          .replace('location.replace("/admin")',
                                   'location.replace("' + BASE + '/admin")')
                      if new_content != content:
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(new_content)
                          print("Patched JS:", path)

          print("Done.")
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
