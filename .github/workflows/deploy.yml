name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject base href and rewrite absolute paths
        run: |
          BASE="/digital-map-binh-dinh"

          # Thêm <base href> vào tất cả HTML
          find . -name "*.html" -not -path "./.git/*" | while read f; do
            sed -i "s|<head>|<head>\n  <base href=\"${BASE}/\">|g" "$f"
          done

          # Sửa detailUrl trong api.js
          sed -i "s|detailUrl: \`/place\.html|detailUrl: \`${BASE}/place.html|g" ./assets/js/core/api.js

          # Sửa location.replace trong các admin JS (chỉ sửa nếu file tồn tại)
          for f in ./assets/js/admin/login.js ./assets/js/admin/dashboard.js ./assets/js/admin/register.js; do
            [ -f "$f" ] && sed -i \
              -e "s|location\.replace(\"/admin/dashboard\")|location.replace(\"${BASE}/admin/dashboard\")|g" \
              -e "s|location\.replace(\"/admin\")|location.replace(\"${BASE}/admin\")|g" \
              "$f"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
